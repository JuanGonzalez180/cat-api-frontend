<div class="min-h-screen bg-gray-50">
  <!-- Header Component -->
  <app-header
    title="Razas de Gatos"
    (logout)="logout()"
    (profileClick)="goToProfile()"
  ></app-header>

  <!-- Content -->
  <div class="max-w-7xl mx-auto px-4 py-8">
    <p-tabs>
      <!-- Tab 1: Breed Selector + Detail -->
      <p-tabpanel header="Detalles de Razas">
        <div class="flex flex-col py-4 space-y-4">
          <!-- Breed Selector Component -->
          <app-breed-selector
            [breeds]="breeds()"
            [selectedBreed]="selectedBreed()"
            (breedSelected)="onBreedSelect($event)"
          ></app-breed-selector>

          <!-- Breed Detail Component -->
          <app-breed-detail
            [breed]="selectedBreed()"
            [images]="breedImages()"
          ></app-breed-detail>
        </div>
      </p-tabpanel>

      <!-- Tab 2: Breeds Table -->
      <p-tabpanel header="Todas las Razas">
        <!-- Breed Table Component -->
        <app-breed-table
          [breeds]="filteredBreeds()"
          [searchQuery]="searchQuery()"
          (search)="searchBreeds($event)"
        ></app-breed-table>
      </p-tabpanel>
    </p-tabs>
  </div>
</div>
