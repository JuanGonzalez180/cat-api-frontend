<div class="flex flex-col space-y-4">
  <!-- Search -->
  <div class="flex gap-2 items-center">
    <input
      pInputText
      type="text"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchQueryChange($event)"
      placeholder="Buscar razas..."
      class="flex-1"
    />
    <p-button label="Buscar" icon="pi pi-search" (click)="onSearch()"></p-button>
  </div>

  <!-- Table -->
  <p-table [value]="breeds" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Origen</th>
        <th>Temperamento</th>
        <th>Inteligencia</th>
        <th>Energía</th>
        <th>Amigable con Niños</th>
      </tr>
    </ng-template>
    <ng-template #body let-breed>
      <tr>
        <td>{{ breed.name }}</td>
        <td>{{ breed.origin }}</td>
        <td>{{ breed.temperament }}</td>
        <td>{{ breed.intelligence }}/5</td>
        <td>{{ breed.energy_level }}/5</td>
        <td>{{ breed.child_friendly }}/5</td>
      </tr>
    </ng-template>
  </p-table>
</div>
