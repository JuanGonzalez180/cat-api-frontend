<div class="min-h-screen bg-gray-100 flex justify-center items-center">
  <p-card class="w-full max-w-md">
    <ng-template pTemplate="header">
      <h1 class="text-2xl font-bold text-center">Perfil de Usuario</h1>
    </ng-template>

    <div class="flex flex-col space-y-4">
      <div class="bg-gray-50 p-4 rounded">
        <p class="text-sm text-gray-600">Nombre</p>
        <p class="text-lg font-semibold">{{ authService.currentUser()?.firstName }}</p>
      </div>

      <div class="bg-gray-50 p-4 rounded">
        <p class="text-sm text-gray-600">Apellido</p>
        <p class="text-lg font-semibold">{{ authService.currentUser()?.lastName }}</p>
      </div>

      <div class="bg-gray-50 p-4 rounded">
        <p class="text-sm text-gray-600">Correo Electrónico</p>
        <p class="text-lg font-semibold">{{ authService.currentUser()?.email }}</p>
      </div>

      @if (authService.currentUser()?._id) {
        <div class="bg-gray-50 p-4 rounded">
          <p class="text-sm text-gray-600">ID de Usuario</p>
          <p class="text-sm font-mono text-gray-700">{{ authService.currentUser()?._id }}</p>
        </div>
      }
    </div>

    <ng-template pTemplate="footer">
      <div class="flex flex-col space-y-2">
        <p-button
          label="Ver Razas"
          icon="pi pi-arrow-right"
          (click)="goToBreeds()"
          class="w-full"
        ></p-button>
        <p-button
          label="Cerrar Sesión"
          icon="pi pi-sign-out"
          severity="danger"
          (click)="logout()"
          class="w-full"
        ></p-button>
      </div>
    </ng-template>
  </p-card>
</div>
